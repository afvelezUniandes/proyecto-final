name: Build and Push to ECR

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  AWS_REGION: us-east-1
  ECR_REPOSITORY: proyecto-final
  ECR_REGISTRY: 108633434648.dkr.ecr.us-east-1.amazonaws.com

jobs:
  # Detectar qué servicios han cambiado
  detect-changes:
    name: Detect Changes
    runs-on: ubuntu-latest
    outputs:
      auth: ${{ steps.filter.outputs.auth }}
      catalog: ${{ steps.filter.outputs.catalog }}
      gateway: ${{ steps.filter.outputs.gateway }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Check for changes
        uses: dorny/paths-filter@v2
        id: filter
        with:
          filters: |
            auth:
              - 'auth-service/**'
            catalog:
              - 'catalog-service/**'
            gateway:
              - 'client-gateway/**'

  # Build y push para auth-service
  build-auth:
    name: Build Auth Service
    needs: detect-changes
    if: needs.detect-changes.outputs.auth == 'true'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push Docker image
        run: |
          docker build -t ${{ env.ECR_REGISTRY }}/${{ env.ECR_REPOSITORY }}:auth-latest ./auth-service
          docker push ${{ env.ECR_REGISTRY }}/${{ env.ECR_REPOSITORY }}:auth-latest

      - name: Image info
        run: |
          echo "✅ Auth service image pushed successfully!"
          echo "Tag: auth-latest"
          echo "Full URI: ${{ env.ECR_REGISTRY }}/${{ env.ECR_REPOSITORY }}:auth-latest"

  # Build y push para catalog-service
  build-catalog:
    name: Build Catalog Service
    needs: detect-changes
    if: needs.detect-changes.outputs.catalog == 'true'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push Docker image
        run: |
          docker build -t ${{ env.ECR_REGISTRY }}/${{ env.ECR_REPOSITORY }}:catalog-latest ./catalog-service
          docker push ${{ env.ECR_REGISTRY }}/${{ env.ECR_REPOSITORY }}:catalog-latest

      - name: Image info
        run: |
          echo "✅ Catalog service image pushed successfully!"
          echo "Tag: catalog-latest"
          echo "Full URI: ${{ env.ECR_REGISTRY }}/${{ env.ECR_REPOSITORY }}:catalog-latest"

  # Build y push para client-gateway
  build-gateway:
    name: Build Gateway Service
    needs: detect-changes
    if: needs.detect-changes.outputs.gateway == 'true'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push Docker image
        run: |
          docker build -t ${{ env.ECR_REGISTRY }}/${{ env.ECR_REPOSITORY }}:gateway-latest ./client-gateway
          docker push ${{ env.ECR_REGISTRY }}/${{ env.ECR_REPOSITORY }}:gateway-latest

      - name: Image info
        run: |
          echo "✅ Gateway service image pushed successfully!"
          echo "Tag: gateway-latest"
          echo "Full URI: ${{ env.ECR_REGISTRY }}/${{ env.ECR_REPOSITORY }}:gateway-latest"

  # Deploy a ECS (solo en main)
  deploy-ecs:
    name: Deploy to ECS
    needs: [build-auth, build-catalog, build-gateway]
    runs-on: ubuntu-latest
    if: |
      always() &&
      !contains(needs.*.result, 'failure') &&
      (needs.build-auth.result == 'success' || needs.build-catalog.result == 'success' || needs.build-gateway.result == 'success')

    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Force new ECS deployment
        run: |
          aws ecs update-service \
            --cluster proyecto-final-cluster \
            --service travelhub-service \
            --force-new-deployment \
            --region us-east-1

      - name: Wait for service stability
        run: |
          echo "Waiting for ECS service to stabilize..."
          aws ecs wait services-stable \
            --cluster proyecto-final-cluster \
            --services travelhub-service \
            --region us-east-1
          echo "✅ ECS service is stable!"

  # Notificación de deployment
  deploy-notification:
    name: Deployment Summary
    needs:
      [detect-changes, build-auth, build-catalog, build-gateway, deploy-ecs]
    runs-on: ubuntu-latest
    if: always()

    steps:
      - name: Summary
        run: |
          echo "## Deployment Summary 🚀" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Services Built:" >> $GITHUB_STEP_SUMMARY

          if [ "${{ needs.detect-changes.outputs.auth }}" == "true" ]; then
            echo "- ✅ Auth Service" >> $GITHUB_STEP_SUMMARY
          else
            echo "- ⏭️ Auth Service (no changes)" >> $GITHUB_STEP_SUMMARY
          fi

          if [ "${{ needs.detect-changes.outputs.catalog }}" == "true" ]; then
            echo "- ✅ Catalog Service" >> $GITHUB_STEP_SUMMARY
          else
            echo "- ⏭️ Catalog Service (no changes)" >> $GITHUB_STEP_SUMMARY
          fi

          if [ "${{ needs.detect-changes.outputs.gateway }}" == "true" ]; then
            echo "- ✅ Gateway Service" >> $GITHUB_STEP_SUMMARY
          else
            echo "- ⏭️ Gateway Service (no changes)" >> $GITHUB_STEP_SUMMARY
          fi

          echo "" >> $GITHUB_STEP_SUMMARY
          echo "✅ Deployment workflow completed!" >> $GITHUB_STEP_SUMMARY

          if [ "${{ needs.deploy-ecs.result }}" == "success" ]; then
            echo "🚀 ECS service redeployed successfully!" >> $GITHUB_STEP_SUMMARY
          elif [ "${{ needs.deploy-ecs.result }}" == "skipped" ]; then
            echo "⏭️ ECS deploy skipped (no builds succeeded)" >> $GITHUB_STEP_SUMMARY
          else
            echo "❌ ECS deploy failed" >> $GITHUB_STEP_SUMMARY
          fi
