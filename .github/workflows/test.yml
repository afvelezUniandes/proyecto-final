name: Run Unit Tests

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop
  workflow_dispatch:

jobs:
  test:
    name: Test ${{ matrix.service.name }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        service:
          - name: Auth Service
            path: ./auth-service
          - name: Catalog Service
            path: ./catalog-service
          - name: Client Gateway
            path: ./client-gateway
          - name: Reservation Service
            path: ./reservation-service

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"

      - name: Install dependencies
        working-directory: ${{ matrix.service.path }}
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests with coverage
        working-directory: ${{ matrix.service.path }}
        run: |
          pytest --cov=. --cov-report=term --cov-report=html --cov-fail-under=70 -v

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-${{ matrix.service.name }}
          path: ${{ matrix.service.path }}/htmlcov
          retention-days: 7

  summary:
    name: Tests Summary
    needs: [test, android-test]
    runs-on: ubuntu-latest
    if: always()

    steps:
      - name: Check test results
        run: |
          if [ "${{ needs.test.result }}" == "success" ] && [ "${{ needs.android-test.result }}" == "success" ]; then
            echo "✅ All tests passed successfully!"
            echo "📊 Code coverage meets the 70% requirement"
            exit 0
          else
            echo "❌ Some tests failed"
            exit 1
          fi

  android-test:
    name: Android Unit Tests & Coverage
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false
          gradle-home-cache-includes: |
            caches
            notifications
            jdks

      - name: Run unit tests with coverage
        working-directory: ./Travelhub-android
        run: ./gradlew jacocoTestReport --build-cache

      - name: Report coverage to summary
        if: always()
        working-directory: ./Travelhub-android
        run: |
          XML=app/build/reports/jacoco/jacocoTestReport/jacocoTestReport.xml
          MISSED=$(grep -oPm1 'type="INSTRUCTION"[^/]*/>' "$XML" | grep -oP 'missed="\K[0-9]+')
          COVERED=$(grep -oPm1 'type="INSTRUCTION"[^/]*/>' "$XML" | grep -oP 'covered="\K[0-9]+')
          TOTAL=$((MISSED + COVERED))
          if [ "$TOTAL" -gt 0 ]; then
            PCT=$(awk "BEGIN {printf \"%.0f\", ($COVERED/$TOTAL)*100}")
          else
            PCT=0
          fi
          echo "### 📊 Android Coverage Report" >> $GITHUB_STEP_SUMMARY
          echo "| Metric | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|--------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| Instructions covered | $COVERED / $TOTAL |" >> $GITHUB_STEP_SUMMARY
          echo "| Coverage | **${PCT}%** |" >> $GITHUB_STEP_SUMMARY
          echo "| Minimum required | 70% |" >> $GITHUB_STEP_SUMMARY
          echo ""
          echo "📊 Android coverage: ${PCT}%"
          if [ "$PCT" -lt 70 ]; then
            echo "❌ Coverage ${PCT}% is below the required 70%"
            exit 1
          else
            echo "✅ Coverage ${PCT}% meets the 70% requirement"
          fi
