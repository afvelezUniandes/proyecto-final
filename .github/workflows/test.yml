name: Run Unit Tests

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop
  workflow_dispatch:

jobs:
  test:
    name: Test ${{ matrix.service.name }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        service:
          - name: Auth Service
            path: ./auth-service
          - name: Catalog Service
            path: ./catalog-service
          - name: Client Gateway
            path: ./client-gateway
          - name: Reservation Service
            path: ./reservation-service

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"

      - name: Install dependencies
        working-directory: ${{ matrix.service.path }}
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests with coverage
        working-directory: ${{ matrix.service.path }}
        run: |
          pytest --cov=. --cov-report=term --cov-report=html --cov-fail-under=70 -v

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-${{ matrix.service.name }}
          path: ${{ matrix.service.path }}/htmlcov
          retention-days: 7

  android-test:
    name: Android Unit Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"
          cache: "gradle"

      - name: Grant gradlew execute permission
        working-directory: ./Travelhub-android
        run: chmod +x gradlew

      - name: Run Android unit tests with coverage
        working-directory: ./Travelhub-android
        run: ./gradlew testDebugUnitTest jacocoTestReport

      - name: Upload Android coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-android
          path: Travelhub-android/app/build/reports/jacoco/jacocoTestReport/html
          retention-days: 7

  summary:
    name: Tests Summary
    needs: [test, android-test]
    runs-on: ubuntu-latest
    if: always()

    steps:
      - name: Check test results
        run: |
          if [ "${{ needs.test.result }}" == "success" ] && [ "${{ needs.android-test.result }}" == "success" ]; then
            echo "✅ All tests passed successfully!"
            echo "📊 Code coverage meets the 70% requirement"
            exit 0
          else
            echo "❌ Some tests failed"
            echo "  Python services: ${{ needs.test.result }}"
            echo "  Android unit tests: ${{ needs.android-test.result }}"
            exit 1
          fi
