name: Run Unit Tests

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop
  workflow_dispatch:

jobs:
  test:
    name: Test ${{ matrix.service.name }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        service:
          - name: Auth Service
            path: ./auth-service
          - name: Catalog Service
            path: ./catalog-service
          - name: Client Gateway
            path: ./client-gateway
          - name: Reservation Service
            path: ./reservation-service

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"

      - name: Install dependencies
        working-directory: ${{ matrix.service.path }}
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests with coverage
        working-directory: ${{ matrix.service.path }}
        run: |
          pytest --cov=. --cov-report=term --cov-report=html --cov-fail-under=70 -v

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-${{ matrix.service.name }}
          path: ${{ matrix.service.path }}/htmlcov
          retention-days: 7

  android-test:
    name: Android Unit Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"
          cache: "gradle"

      - name: Grant gradlew execute permission
        working-directory: ./Travelhub-android
        run: chmod +x gradlew

      - name: Run Android unit tests with coverage
        working-directory: ./Travelhub-android
        run: ./gradlew testDebugUnitTest jacocoTestReport

      - name: Upload Android coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-android
          path: Travelhub-android/app/build/reports/jacoco/jacocoTestReport/html
          retention-days: 7

  e2e-test:
    name: Playwright E2E Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Start backend stack (docker-compose)
        run: |
          docker compose up -d --build
          echo "Waiting for services to be healthy..."
          timeout 120 bash -c 'until docker compose ps | grep -E "healthy|running" | wc -l | grep -q "^[5-9]"; do sleep 3; done' || true
          sleep 10

      - name: Seed catalog data
        run: |
          docker compose exec -T postgres psql -U travelhub_user -d travelhub -f /dev/stdin < seed_catalog.sql || true

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: travelhub-web/package-lock.json

      - name: Install Angular dependencies
        working-directory: ./travelhub-web
        run: npm ci

      - name: Install Playwright browsers
        working-directory: ./travelhub-web
        run: npx playwright install chromium --with-deps

      - name: Start Angular app
        working-directory: ./travelhub-web
        run: npx ng serve --configuration development &
        env:
          CI: true

      - name: Wait for Angular to be ready
        run: |
          timeout 120 bash -c 'until curl -sf http://localhost:4200 > /dev/null; do sleep 2; done'

      - name: Run Playwright tests
        working-directory: ./travelhub-web
        run: npx playwright test --reporter=html
        env:
          PLAYWRIGHT_BASE_URL: http://localhost:4200

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-web
          path: travelhub-web/playwright-report
          retention-days: 7

  e2e-hotel-test:
    name: Playwright E2E Tests (travelhub-hotel)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Start backend stack (docker-compose)
        run: |
          docker compose up -d --build
          echo "Waiting for services to be healthy..."
          timeout 120 bash -c 'until docker compose ps | grep -E "healthy|running" | wc -l | grep -q "^[5-9]"; do sleep 3; done' || true
          sleep 10

      - name: Seed catalog data
        run: |
          docker compose exec -T postgres psql -U travelhub_user -d travelhub -f /dev/stdin < seed_catalog.sql || true

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: travelhub-hotel/package-lock.json

      - name: Install Angular dependencies
        working-directory: ./travelhub-hotel
        run: npm ci

      - name: Install Playwright browsers
        working-directory: ./travelhub-hotel
        run: npx playwright install chromium --with-deps

      - name: Start travelhub-hotel app
        working-directory: ./travelhub-hotel
        run: npx ng serve --port 4201 --configuration development &
        env:
          CI: true

      - name: Wait for travelhub-hotel to be ready
        run: |
          timeout 120 bash -c 'until curl -sf http://localhost:4201 > /dev/null; do sleep 2; done'

      - name: Run Playwright tests
        working-directory: ./travelhub-hotel
        run: npx playwright test --reporter=html
        env:
          PLAYWRIGHT_BASE_URL: http://localhost:4201

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-hotel
          path: travelhub-hotel/playwright-report
          retention-days: 7

  summary:
    name: Tests Summary
    needs: [test, android-test, e2e-test, e2e-hotel-test]
    runs-on: ubuntu-latest
    if: always()

    steps:
      - name: Check test results
        run: |
          if [ "${{ needs.test.result }}" == "success" ] && [ "${{ needs.android-test.result }}" == "success" ] && [ "${{ needs.e2e-test.result }}" == "success" ] && [ "${{ needs.e2e-hotel-test.result }}" == "success" ]; then
            echo "✅ All tests passed successfully!"
            echo "📊 Code coverage meets the 70% requirement"
            exit 0
          else
            echo "❌ Some tests failed"
            echo "  Python services: ${{ needs.test.result }}"
            echo "  Android unit tests: ${{ needs.android-test.result }}"
            echo "  Playwright E2E (web): ${{ needs.e2e-test.result }}"
            echo "  Playwright E2E (hotel): ${{ needs.e2e-hotel-test.result }}"
            exit 1
          fi
