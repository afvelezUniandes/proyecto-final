<header>
  <nav
    aria-label="Navegación principal"
    class="bg-[#1D4ED8] px-6 py-4 flex items-center justify-between shadow-lg"
  >
    <div class="flex items-center gap-3">
      <div
        class="w-9 h-9 bg-[#F97316] rounded-xl flex items-center justify-center shadow"
        aria-hidden="true"
      >
        <span class="text-white font-bold text-lg">T</span>
      </div>
      <a routerLink="/home" class="text-white font-bold text-xl">TravelHub</a>
    </div>

    <div class="flex items-center gap-6">
      <a routerLink="/home" class="text-white/90 text-sm font-medium hover:text-white transition">
        {{ 'NAV.HOME' | translate }}
      </a>
      @if (auth.isLoggedIn()) {
        <a
          routerLink="/reservations"
          class="text-white/90 text-sm font-medium hover:text-white transition"
        >
          {{ 'NAV.RESERVATIONS' | translate }}
        </a>
      }
      <app-language-selector />
      @if (auth.isLoggedIn()) {
        <a
          routerLink="/profile"
          class="w-9 h-9 bg-white/20 rounded-full flex items-center justify-center text-white text-sm font-bold border border-white/30 hover:bg-white/30 transition"
          [attr.aria-label]="'NAV.PROFILE' | translate"
        >
          {{ userInitials() }}
        </a>
      } @else {
        <a
          routerLink="/login"
          class="text-white/90 text-sm font-medium hover:text-white transition"
        >
          {{ 'NAV.LOGIN' | translate }}
        </a>
      }
    </div>
  </nav>
</header>
