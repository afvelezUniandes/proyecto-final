version: "3.8"

services:
  auth-service:
    build: ./auth-service
    ports:
      - "5010:5000"
    environment:
      AUTH_DATABASE_URL: postgresql://${RDS_USER}:${RDS_PASS}@${RDS_HOST}:5432/postgres
      JWT_SECRET: ${JWT_SECRET}
      CATALOG_SERVICE_URL: http://catalog-service:5001
      NOTIFICATION_SERVICE_URL: http://notification-service:5004
    networks:
      - travelhub-net

  catalog-service:
    build: ./catalog-service
    ports:
      - "5001:5001"
    environment:
      CATALOG_DATABASE_URL: postgresql://${RDS_USER}:${RDS_PASS}@${RDS_HOST}:5432/postgres
      CACHE_TTL: 300
      S3_BUCKET: ${S3_BUCKET}
      S3_REGION: ${S3_REGION}
    networks:
      - travelhub-net

  client-gateway:
    build: ./client-gateway
    ports:
      - "8000:8000"
    environment:
      AUTH_SERVICE_URL: http://auth-service:5000
      CATALOG_SERVICE_URL: http://catalog-service:5001
      RESERVATION_SERVICE_URL: http://reservation-service:5002
      JWT_SECRET: ${JWT_SECRET}
    depends_on:
      - auth-service
      - catalog-service
      - reservation-service
    networks:
      - travelhub-net

  reservation-service:
    build: ./reservation-service
    ports:
      - "5002:5002"
    environment:
      RESERVATION_DATABASE_URL: postgresql://${RDS_USER}:${RDS_PASS}@${RDS_HOST}:5432/postgres
      JWT_SECRET: ${JWT_SECRET}
      NOTIFICATION_SERVICE_URL: http://notification-service:5004
      AUTH_SERVICE_URL: http://auth-service:5000
      CATALOG_SERVICE_URL: http://catalog-service:5001
    networks:
      - travelhub-net

  notification-service:
    build: ./notification-service
    ports:
      - "5004:5004"
    environment:
      NOTIFICATION_DATABASE_URL: postgresql://${RDS_USER}:${RDS_PASS}@${RDS_HOST}:5432/postgres
      JWT_SECRET: ${JWT_SECRET}
      PORT: "5004"
      SENDGRID_API_KEY: ${SENDGRID_API_KEY}
      SENDGRID_FROM_EMAIL: ${SENDGRID_FROM_EMAIL}
    networks:
      - travelhub-net

networks:
  travelhub-net:
    driver: bridge
